<!DOCTYPE html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4efe6" />
  <title>Article Reader — Studio</title>
  <meta name="description" content="Editorial article on software and design craft." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body data-page="article">
  <div id="readingProgress" aria-hidden="true"></div>

  <a class="skip-link" href="#main">Skip to content</a>

  <div class="cursor" aria-hidden="true">
    <div class="cursor__dot"></div>
    <div class="cursor__ring"></div>
    <div class="cursor__label"></div>
  </div>

  <header class="nav" role="banner">
    <a class="nav__logo" href="../index.html" data-logo title="Click 5 times for a small secret">
      <span class="nav__mark">◐</span>
      <span class="nav__name">Studio</span>
    </a>

    <nav class="nav__links" aria-label="Primary">
      <a href="work.html" data-cursor="view">Work</a>
      <a href="writing.html" data-cursor="read" class="is-active">Writing</a>
      <a href="experiments.html" data-cursor="play">Experiments</a>
      <a href="about.html" data-cursor="view">About</a>
      <a href="contact.html" data-cursor="open">Contact</a>
    </nav>

    <div class="nav__actions">
      <button class="nav__theme-btn" data-theme-toggle title="Cycle Paper / Clay / Nocturne themes">◐ Paper</button>
      <button class="nav__mobile-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <main id="main">
    <article class="article-reader" id="articleContainer">
      <!-- Injected dynamically via JS -->
    </article>

    <footer class="foot">
      <p>© <span id="year"></span> Studio. A working portfolio.</p>
      <p>Built with restraint.</p>
    </footer>
  </main>

  <script src="../data.js"></script>
  <script src="../router.js"></script>
  <script src="../app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('articleContainer');
      const article = window.Router.getCurrentArticle();

      if (!article) {
        container.innerHTML = `<p>Article not found. <a href="writing.html">Return to all writing</a></p>`;
        return;
      }

      document.title = `${article.title} — Studio`;

      const allArticles = window.STUDIO.articles;
      const currentIndex = allArticles.findIndex(a => a.slug === article.slug);
      const nextArticle = allArticles[(currentIndex + 1) % allArticles.length];

      // Parse markdown-like content blocks
      const formattedBody = article.body.map(block => {
        if (block.startsWith('### ')) {
          return `<h3>${block.replace('### ', '')}</h3>`;
        } else if (block.startsWith('1. ') || block.startsWith('- ')) {
          return `<p style="margin-left:18px; margin-bottom:12px;">• ${block.replace(/^[0-9]+\.\s*|-\s*/, '')}</p>`;
        } else {
          // Replace inline bold **text**
          const boldParsed = block.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          return `<p>${boldParsed}</p>`;
        }
      }).join('');

      container.innerHTML = `
        <a href="writing.html" class="case-study__back" data-cursor="read">← Back to all writing</a>

        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:16px;">
          <div class="article-reader__meta" style="margin-bottom:0;">
            <span>${article.date}</span>
            <span>•</span>
            <span class="tag-pill">${article.tag}</span>
            <span>•</span>
            <span>${article.read}</span>
          </div>
          <button class="btn btn--ghost" id="copyArticleLink" style="padding:5px 12px; font-size:0.75rem;">🔗 Copy Link</button>
        </div>

        <h1 class="article-reader__title">${article.title}</h1>
        <div class="article-reader__excerpt">${article.excerpt}</div>

        <div class="article-reader__body">
          ${formattedBody}
        </div>

        <div class="case-study__callout" style="margin-top:60px;">
          <h3>Colophon</h3>
          <p>Written by Studio. If this provoked a question or disagreement, I welcome your thoughts via <a href="contact.html" style="text-decoration:underline; color:var(--clay);">the contact page</a>.</p>
        </div>

        <nav class="case-study__nav">
          <a href="writing.html" class="btn btn--ghost" data-cursor="read">← All Writing</a>
          <a href="article.html?a=${nextArticle.slug}" class="btn btn--primary" data-cursor="read">Next: ${nextArticle.title} →</a>
        </nav>
      `;

      const copyBtn = document.getElementById('copyArticleLink');
      if (copyBtn) {
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(window.location.href);
            window.showToast("Article link copied to clipboard!");
          } catch(e) {
            window.showToast("Link: " + window.location.href);
          }
        });
      }

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          window.location.href = 'writing.html';
        }
      });

      if (window.refreshCursorEvents) window.refreshCursorEvents();
    });
  </script>
</body>
</html>
