<!DOCTYPE html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4efe6" />
  <title>Case Study — Studio</title>
  <meta name="description" content="In-depth design case study." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
</head>
<body data-page="project">
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="cursor" aria-hidden="true">
    <div class="cursor__dot"></div>
    <div class="cursor__ring"></div>
    <div class="cursor__label"></div>
  </div>

  <header class="nav" role="banner">
    <a class="nav__logo" href="../index.html" data-logo title="Click 5 times for a small secret">
      <span class="nav__mark">◐</span>
      <span class="nav__name">Studio</span>
    </a>

    <nav class="nav__links" aria-label="Primary">
      <a href="work.html" data-cursor="view" class="is-active">Work</a>
      <a href="writing.html" data-cursor="read">Writing</a>
      <a href="experiments.html" data-cursor="play">Experiments</a>
      <a href="about.html" data-cursor="view">About</a>
      <a href="contact.html" data-cursor="open">Contact</a>
    </nav>

    <div class="nav__actions">
      <button class="nav__theme-btn" data-theme-toggle title="Cycle Paper / Clay / Nocturne themes">◐ Paper</button>
      <button class="nav__mobile-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <main id="main">
    <article class="case-study" id="caseStudyContainer">
      <!-- Injected dynamically via JS -->
    </article>

    <footer class="foot">
      <p>© <span id="year"></span> Studio. A working portfolio.</p>
      <p>Built with restraint.</p>
    </footer>
  </main>

  <script src="../data.js"></script>
  <script src="../router.js"></script>
  <script src="../app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('caseStudyContainer');
      const project = window.Router.getCurrentProject();

      if (!project) {
        container.innerHTML = `<p>Project not found. <a href="work.html">Return to all work</a></p>`;
        return;
      }

      document.title = `${project.title} — Case Study — Studio`;

      const allProjects = window.STUDIO.projects;
      const currentIndex = allProjects.findIndex(p => p.slug === project.slug);
      const nextProject = allProjects[(currentIndex + 1) % allProjects.length];

      container.innerHTML = `
        <a href="work.html" class="case-study__back" data-cursor="view">← Back to all work</a>

        <header class="case-study__header">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px;">
            <div class="case-study__number">§${project.n} • ${project.year}</div>
            <button class="btn btn--ghost" id="copyProjectLink" style="padding:6px 14px; font-size:0.78rem;">🔗 Copy Link</button>
          </div>
          <h1 class="case-study__title">${project.title}</h1>
          <p class="case-study__thesis">${project.thesis}</p>

          <div class="case-study__meta-grid">
            <div class="case-study__meta-item">
              <span>Category</span>
              <strong>${project.category}</strong>
            </div>
            <div class="case-study__meta-item">
              <span>Role</span>
              <strong>${project.role}</strong>
            </div>
            <div class="case-study__meta-item">
              <span>Timeline</span>
              <strong>${project.year}</strong>
            </div>
          </div>
        </header>

        ${project.metrics && project.metrics.length ? `
          <div class="metrics-row">
            ${project.metrics.map(m => `
              <div class="metric-box">
                <div class="metric-box__val">${m.value}</div>
                <div class="metric-box__label">${m.label}</div>
              </div>
            `).join('')}
          </div>
        ` : ''}

        <section class="case-study__section">
          <h2>01 / The Friction & Problem</h2>
          <p>${project.problem}</p>
        </section>

        <section class="case-study__section">
          <h2>02 / The Core Concept</h2>
          <p>${project.idea}</p>
        </section>

        <section class="case-study__section">
          <h2>03 / Research & Process</h2>
          <ul class="case-study__checklist">
            ${project.process.map(item => `<li>${item}</li>`).join('')}
          </ul>
        </section>

        <section class="case-study__section">
          <h2>04 / Key Design Decisions</h2>
          <ul class="case-study__checklist">
            ${project.design.map(item => `<li>${item}</li>`).join('')}
          </ul>
        </section>

        <div class="case-study__callout">
          <h3>Reflection & What Was Learned</h3>
          <p>${project.learned}</p>
        </div>

        <nav class="case-study__nav">
          <a href="work.html" class="btn btn--ghost" data-cursor="view">← All Work</a>
          <a href="project.html?p=${nextProject.slug}" class="btn btn--primary" data-cursor="view">Next: ${nextProject.title} →</a>
        </nav>
      `;

      const copyBtn = document.getElementById('copyProjectLink');
      if (copyBtn) {
        copyBtn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(window.location.href);
            window.showToast("Case study link copied to clipboard!");
          } catch (e) {
            window.showToast("Link: " + window.location.href);
          }
        });
      }

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          window.location.href = 'work.html';
        }
      });

      if (window.refreshCursorEvents) window.refreshCursorEvents();
    });
  </script>
</body>
</html>
